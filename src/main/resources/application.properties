spring.application.name=newBank

# JPA/Hibernate gegen die eingebettete H2-In-Memory-Datenbank.
# Die Datenbank wird bei jedem Start neu erzeugt und ist beim Beenden wieder weg.
spring.jpa.hibernate.ddl-auto=update
# Standardmaessig aktiviert; explizit abgeschaltet, um die Startup-Warnung
# zu vermeiden und Lazy-Loading nicht bis in den View-Layer zu erlauben.
spring.jpa.open-in-view=false

# Actuator: /actuator/health liefert den Anwendungsstatus (inkl. DB-Check).
management.endpoint.health.show-details=always


# File-based H2 database: persists across restarts.
spring.datasource.url=jdbc:h2:file:./data/newbank;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
